name: Community Bonsai

on:
  issues:
    types: [opened]
  schedule:
    - cron: "0 17 * * *" # 00:00 WIB daily
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to execute"
        required: false
        default: "sync"
        type: choice
        options:
          - sync
          - decay
          - water
          - render
      user:
        description: "Username (for water mode)"
        required: false
        default: "Mufath"
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: community-bonsai
  cancel-in-progress: false

jobs:
  update-bonsai:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.title, 'Siram Bonsai') ||
      contains(github.event.issue.title, 'water-bonsai') ||
      contains(join(github.event.issue.labels.*.name, ','), 'water-bonsai')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update bonsai state and render SVG cards
        id: bonsai
        env:
          PYTHONPATH: scripts
          ISSUE_USER: ${{ github.event.issue.user.login }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_USER: ${{ inputs.user }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python scripts/bonsai.py --mode water --user "$ISSUE_USER"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${INPUT_MODE:-sync}"
            USER_ARG="${INPUT_USER:-${{ github.actor }}}"
            python scripts/bonsai.py --mode "$MODE" --user "$USER_ARG"
          else
            python scripts/bonsai.py --mode decay
          fi

      - name: Commit updated bonsai state & cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bonsai_state.json cards/bonsai-dark.svg cards/bonsai-light.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Community Bonsai [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Reply and close watering issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ steps.bonsai.outputs.comment }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT_BODY"
          gh issue close "$ISSUE_NUMBER" --reason completed
