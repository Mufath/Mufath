name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # everyday at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: Mufath
          outputs: |
            cards/github-contribution-grid-snake.svg
            cards/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Snake to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/github-contribution-grid-snake*.svg
          if git diff --staged --quiet; then
            echo "No changes in snake"
          else
            git commit -m "Update contribution snake [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
