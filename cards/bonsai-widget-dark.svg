<svg xmlns="http://www.w3.org/2000/svg" width="800" height="256" viewBox="0 0 800 256" fill="none" role="img" aria-labelledby="bonsai-title bonsai-desc">
  <title id="bonsai-title">Community Bonsai Lv.1 Sprout</title>
  <desc id="bonsai-desc">Moisture 100%, Status Thriving, Views 66, Watered 1, Just looking 65.</desc>
  <defs>
    <clipPath id="scene-clip">
      <rect x="16" y="16" width="264" height="224" rx="12"/>
    </clipPath>
  </defs>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    .num {
      font-variant-numeric: tabular-nums;
    }
    .enter-bar {
      transform-box: fill-box;
      transform-origin: left center;
      animation: growX 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes growX {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Outer Apple Card Shell (radius 28, padding 16 -> nested radius 12) -->
  <rect x="0.5" y="0.5" width="799" height="255" rx="28" fill="#1C1C1E" stroke="rgba(255,255,255,0.09)"/>

  <!-- Left Botanical Habitat Scene -->
  <g clip-path="url(#scene-clip)">
    <rect x="16" y="16" width="264" height="224" fill="#18221D"/>
    <g transform="translate(16 24)">
      
    <defs>
      <linearGradient id="sun-wash" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
        <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="264" height="184" fill="url(#sun-wash)"/>
    <rect x="0" y="184" width="264" height="32" fill="#2A2521"/>
    <line x1="0" y1="184" x2="264" y2="184" stroke="#1E1A17" stroke-width="1"/>
    <ellipse cx="132" cy="186" rx="46" ry="5" fill="rgba(0,0,0,0.22)"/>
    <!-- Ceramic Pot -->
    <path d="M92 154 L172 154 L164 181 Q162 185 158 185 L106 185 Q102 185 100 181 Z" fill="#3A3F45"/>
    <path d="M144 154 L172 154 L164 181 Q162 185 158 185 L142 185 Z" fill="#262A2F" opacity="0.45"/>
    <rect x="86" y="148" width="92" height="7" rx="3" fill="#4A5058"/>
    <rect x="104" y="184" width="12" height="3" rx="1" fill="#262A2F"/>
    <rect x="148" y="184" width="12" height="3" rx="1" fill="#262A2F"/>
    <ellipse cx="132" cy="148" rx="38" ry="4" fill="#33261D"/>
    <ellipse cx="122" cy="148" rx="14" ry="2.5" fill="#2E7D4F" opacity="0.8"/>
    <!-- Stage 1: Sprout -->
    <path d="M132 148 C131 134 136 122 133 108" stroke="#472E1E" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M131 148 C130 134 135 122 132 108" stroke="#6D4830" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M130 146 C129 134 133 124 131 112" stroke="#8F6244" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M133 114 C118 112 108 100 112 91 C124 91 133 101 133 114 Z" fill="#2D8A56"/>
    <path d="M132 110 C121 107 115 99 116 93 C124 94 130 101 132 110 Z" fill="#49B675"/>
    <path d="M133 109 C145 104 156 108 154 117 C144 120 135 115 133 109 Z" fill="#1B5E3A"/>
    <path d="M134 109 C144 106 152 109 151 115 C143 117 137 113 134 109 Z" fill="#2D8A56"/>
    <ellipse cx="132" cy="99" rx="15" ry="9" fill="#1B5E3A"/><ellipse cx="130" cy="96" rx="13.8" ry="7.9" fill="#2D8A56"/><ellipse cx="129.6" cy="93.5" rx="9.3" ry="4.3" fill="#49B675"/>
    </g>
    <text x="32" y="36" font-size="12" font-weight="500" fill="#A1A1A6">Stage 1 of 5 · Sprout</text>
  </g>
  <rect x="16.5" y="16.5" width="263" height="223" rx="12" stroke="rgba(255,255,255,0.09)" fill="none"/>

  <!-- Right Telemetry Column -->
  <!-- Header -->
  <text x="296" y="36" font-size="17" font-weight="600" fill="#F5F5F7">Community Bonsai</text>
  <circle cx="718.0" cy="31" r="3.5" fill="#30D158"/>
  <text x="784" y="35" text-anchor="end" font-size="13" font-weight="500" fill="#A1A1A6">Thriving</text>
  <text x="296" y="55" font-size="13" font-weight="400" fill="#A1A1A6">Last watered by @Mufath · 18m ago</text>

  <!-- Middle Asymmetric Metric Row -->
  <!-- Left Hero Card: Moisture Ring + Tabular Readout -->
  <rect x="296" y="72" width="268" height="84" rx="12" fill="#2C2C2E" stroke="rgba(255,255,255,0.09)"/>
  <circle cx="336" cy="114" r="22" stroke="#3A3A3C" stroke-width="5" fill="none"/>
  <circle cx="336" cy="114" r="22" stroke="#30D158" stroke-width="5" stroke-linecap="round"
    stroke-dasharray="138.23" stroke-dashoffset="0.00" transform="rotate(-90 336 114)" fill="none"/>
  <path d="M336 106.5s-4.5 4.9-4.5 7.6a4.5 4.5 0 0 0 9 0c0-2.7-4.5-7.6-4.5-7.6Z" stroke="#30D158" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  <text x="376" y="114" font-size="28" font-weight="500" fill="#F5F5F7" letter-spacing="-0.02em" class="num">100%</text>
  <text x="376" y="133" font-size="12" font-weight="400" fill="#A1A1A6">Moisture · Thriving</text>

  <!-- Right Compact Card: Growth XP -->
  <rect x="576" y="72" width="208" height="84" rx="12" fill="#2C2C2E" stroke="rgba(255,255,255,0.09)"/>
  <text x="592" y="96" font-size="12" font-weight="400" fill="#A1A1A6">Growth</text>
  <text x="768" y="96" text-anchor="end" font-size="12" font-weight="400" fill="#8E8E93" class="num">10 / 30 XP</text>
  <text x="592" y="121" font-size="15" font-weight="500" fill="#F5F5F7">Lv. 1 · Sprout</text>
  <rect x="592" y="135" width="176" height="6" rx="3" fill="#3A3A3C"/>
  <rect x="592" y="135" width="58.7" height="6" rx="3" fill="#0A84FF" class="enter-bar"/>

  <!-- Bottom Grouped Card: Visitor Views vs Care Share -->
  <rect x="296" y="168" width="488" height="72" rx="12" fill="#2C2C2E" stroke="rgba(255,255,255,0.09)"/>
  <text x="312" y="194" font-size="12" font-weight="400" fill="#A1A1A6">Profile views <tspan font-size="14" font-weight="500" fill="#F5F5F7" class="num" dx="4">66</tspan></text>
  <text x="536" y="194" text-anchor="middle" font-size="12" font-weight="400" fill="#A1A1A6">Watered <tspan font-size="14" font-weight="500" fill="#0A84FF" class="num" dx="4">1</tspan> <tspan font-size="12" fill="#8E8E93" class="num">(1.5%)</tspan></text>
  <text x="768" y="194" text-anchor="end" font-size="12" font-weight="400" fill="#A1A1A6">Just looking <tspan font-size="14" font-weight="500" fill="#F5F5F7" class="num" dx="4">65</tspan></text>

  <rect x="312" y="212" width="456" height="6" rx="3" fill="#3A3A3C"/>
  <rect x="312" y="212" width="6.9" height="6" rx="3" fill="#0A84FF" class="enter-bar"/>
</svg>
