  <text x="326" y="186" font-size="11.5" font-weight="500" fill="#CBD5E1">Visitor activity</text>
  <text x="758" y="186" text-anchor="end" font-size="11.5" font-weight="500" fill="#0A84FF" class="num">2.5% watered</text>

  <line x1="464" y1="198" x2="464" y2="242" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="620" y1="198" x2="620" y2="242" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Column 1: Profile Views -->
  <g transform="translate(326 198)" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M1 7s2.3-4 6-4 6 4 6 4-2.3 4-6 4-6-4-6-4Z"/>
