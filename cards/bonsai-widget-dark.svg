  <circle cx="352" cy="113" r="5.5" fill="#0A84FF"/><circle cx="352" cy="113" r="2" fill="#FFFFFF"/>
  <text x="352" y="137" text-anchor="middle" font-size="11" font-weight="400" fill="#CBD5E1">Sprout</text>
  <circle cx="446" cy="113" r="9" fill="#0A84FF" fill-opacity="0.22"/><circle cx="446" cy="113" r="5.5" fill="#0A84FF"/><circle cx="446" cy="113" r="2" fill="#FFFFFF"/>
  <text x="446" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#F5F5F7">Sapling</text>
