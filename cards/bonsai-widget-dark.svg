  <text x="540" y="137" text-anchor="middle" font-size="11" font-weight="400" fill="#94A3B8">Young</text>
  <circle cx="634" cy="113" r="4.5" fill="#1E303C" stroke="rgba(255,255,255,0.34)" stroke-width="1.5"/>
  <text x="634" y="137" text-anchor="middle" font-size="11" font-weight="400" fill="#94A3B8">Blooming</text>
  <circle cx="728" cy="113" r="4.5" fill="#1E303C" stroke="rgba(255,255,255,0.34)" stroke-width="1.5"/>
  <text x="728" y="137" text-anchor="middle" font-size="11" font-weight="400" fill="#94A3B8">Ancient</text>

