<svg xmlns="http://www.w3.org/2000/svg" width="800" height="256" viewBox="0 0 800 256" fill="none" role="img" aria-labelledby="bonsai-title bonsai-desc">
  <title id="bonsai-title">Community Bonsai Lv.1 Sprout</title>
  <desc id="bonsai-desc">Moisture 100%, Status Thriving, Views 86, Watered 1, Just looking 85.</desc>
  <defs>
    <linearGradient id="shell-surf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="100%" stop-color="#1B1B1D"/>
    </linearGradient>
    <linearGradient id="shell-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <linearGradient id="card-surf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F2F32"/>
      <stop offset="100%" stop-color="#28282A"/>
    </linearGradient>
    <linearGradient id="card-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <linearGradient id="app-icon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34C759"/>
      <stop offset="100%" stop-color="#248A3D"/>
    </linearGradient>
    <clipPath id="scene-clip">
      <rect x="16" y="16" width="264" height="224" rx="16"/>
    </clipPath>
  </defs>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    .num {
      font-variant-numeric: tabular-nums;
    }
    .enter-bar {
      transform-box: fill-box;
      transform-origin: left center;
      animation: growX 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes growX {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Outer Apple Widget Shell (radius 32, padding 16 -> nested radius 16) -->
  <rect x="0.5" y="0.5" width="799" height="255" rx="32" fill="url(#shell-surf)" stroke="url(#shell-bevel)"/>

  <!-- Left Apple Weather-Style Botanical Sky Window -->
  <g clip-path="url(#scene-clip)">
    <g transform="translate(16 16)">
      
    <defs>
      <linearGradient id="apple-sky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#132238"/>
        <stop offset="52%" stop-color="#1D3554"/>
        <stop offset="100%" stop-color="#2B4B72"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="264" height="190" fill="url(#apple-sky)"/>
    <circle cx="218" cy="46" r="14" fill="#93C5FD" opacity="0.16"/>
    <circle cx="218" cy="46" r="6.5" fill="#93C5FD" opacity="0.85"/>
    <circle cx="221" cy="44" r="5.8" fill="#132238"/>
    <circle cx="56" cy="52" r="1.1" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="174" cy="34" r="1.3" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="92" cy="68" r="0.9" fill="#FFFFFF" opacity="0.45"/>
    <rect x="0" y="184" width="264" height="32" fill="#2A2420"/>
    <line x1="0" y1="184" x2="264" y2="184" stroke="#1E1916" stroke-width="1"/>
    <ellipse cx="132" cy="186" rx="46" ry="5" fill="rgba(0,0,0,0.22)"/>
    <!-- Ceramic Pot -->
    <path d="M92 154 L172 154 L164 181 Q162 185 158 185 L106 185 Q102 185 100 181 Z" fill="#3A3F45"/>
    <path d="M144 154 L172 154 L164 181 Q162 185 158 185 L142 185 Z" fill="#23272C" opacity="0.45"/>
    <rect x="86" y="148" width="92" height="7" rx="3" fill="#4C525A"/>
    <rect x="104" y="184" width="12" height="3" rx="1" fill="#23272C"/>
    <rect x="148" y="184" width="12" height="3" rx="1" fill="#23272C"/>
    <ellipse cx="132" cy="148" rx="38" ry="4" fill="#33261D"/>
    <ellipse cx="122" cy="148" rx="14" ry="2.5" fill="#2E7D4F" opacity="0.8"/>
    <!-- Stage 1: Sprout -->
    <path d="M132 148 C131 134 136 122 133 108" stroke="#472E1E" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M131 148 C130 134 135 122 132 108" stroke="#6D4830" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M130 146 C129 134 133 124 131 112" stroke="#8F6244" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M133 114 C118 112 108 100 112 91 C124 91 133 101 133 114 Z" fill="#2D8A56"/>
    <path d="M132 110 C121 107 115 99 116 93 C124 94 130 101 132 110 Z" fill="#49B675"/>
    <path d="M133 109 C145 104 156 108 154 117 C144 120 135 115 133 109 Z" fill="#1B5E3A"/>
    <path d="M134 109 C144 106 152 109 151 115 C143 117 137 113 134 109 Z" fill="#2D8A56"/>
    <ellipse cx="132" cy="99" rx="15" ry="9" fill="#1B5E3A"/><ellipse cx="130" cy="96" rx="13.8" ry="7.9" fill="#2D8A56"/><ellipse cx="129.6" cy="93.5" rx="9.3" ry="4.3" fill="#49B675"/>
    </g>
    <text x="32" y="40" font-size="12" font-weight="500" fill="rgba(255,255,255,0.88)">Stage 1 of 5 · Sprout</text>
  </g>
  <rect x="16.5" y="16.5" width="263" height="223" rx="16" stroke="url(#card-bevel)" fill="none"/>

  <!-- Right Apple Widget Modules -->
  <!-- Widget Header with Apple App Icon Tile -->
  <rect x="296" y="18" width="32" height="32" rx="8" fill="url(#app-icon-grad)"/>
  <path d="M306 39c1-6.5 5-10.5 11.5-11.5-1 6.5-5 10.5-11.5 11.5Z" fill="#FFFFFF"/>
  <path d="M306 39l5-5" stroke="#248A3D" stroke-width="1.3" stroke-linecap="round"/>
  <text x="338" y="32" font-size="15.5" font-weight="600" fill="#F5F5F7">Community Bonsai</text>
  <text x="338" y="48" font-size="12" font-weight="400" fill="#AEAEB2">Last watered by @Mufath · 26m ago</text>

  <!-- Status Capsule -->
  <rect x="690" y="21" width="94" height="26" rx="13" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.04)"/>
  <circle cx="703" cy="34" r="3.5" fill="#30D158"/>
  <text x="714" y="38" font-size="12" font-weight="500" fill="#F5F5F7">Thriving</text>

  <!-- Middle Asymmetric Row -->
  <!-- Left Card: Apple Fitness Tinted Moisture Ring -->
  <rect x="296" y="64" width="260" height="92" rx="16" fill="url(#card-surf)" stroke="url(#card-bevel)"/>
  <circle cx="342" cy="110" r="24" stroke="#30D158" stroke-opacity="0.20" stroke-width="6" fill="none"/>
  <circle cx="342" cy="110" r="24" stroke="#30D158" stroke-width="6" stroke-linecap="round"
    stroke-dasharray="150.80" stroke-dashoffset="0.00" transform="rotate(-90 342 110)" fill="none"/>
  <path d="M342 102s-4.5 4.9-4.5 7.6a4.5 4.5 0 0 0 9 0c0-2.7-4.5-7.6-4.5-7.6Z" stroke="#30D158" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  <text x="382" y="111" font-size="30" font-weight="600" fill="#F5F5F7" letter-spacing="-0.02em" class="num">100%</text>
  <text x="382" y="130" font-size="12" font-weight="400" fill="#AEAEB2">Moisture · Thriving</text>

  <!-- Right Card: Growth Progress -->
  <rect x="568" y="64" width="216" height="92" rx="16" fill="url(#card-surf)" stroke="url(#card-bevel)"/>
  <text x="584" y="88" font-size="12" font-weight="400" fill="#AEAEB2">Growth</text>
  <text x="768" y="88" text-anchor="end" font-size="12" font-weight="400" fill="#8E8E93" class="num">10 / 30 XP</text>
  <text x="584" y="114" font-size="16" font-weight="600" fill="#F5F5F7">Lv. 1 · Sprout</text>
  <rect x="584" y="130" width="184" height="8" rx="4" fill="#3A3A3D"/>
  <rect x="584" y="130" width="61.3" height="8" rx="4" fill="#0A84FF" class="enter-bar"/>

  <!-- Bottom Card: Apple Storage-Style Visitor Care Bar -->
  <rect x="296" y="168" width="488" height="72" rx="16" fill="url(#card-surf)" stroke="url(#card-bevel)"/>
  <text x="312" y="190" font-size="12.5" font-weight="500" fill="#F5F5F7">Visitor activity</text>
  <text x="768" y="190" text-anchor="end" font-size="12" font-weight="400" fill="#AEAEB2" class="num">86 total</text>

  <rect x="312" y="200" width="12.0" height="10" rx="5" fill="#0A84FF" class="enter-bar"/>
  <rect x="326.0" y="200" width="442.0" height="10" rx="5" fill="#545458"/>

  <circle cx="316" cy="224" r="3.5" fill="#0A84FF"/>
  <text x="326" y="228" font-size="11.5" font-weight="400" fill="#AEAEB2">Watered <tspan font-weight="500" fill="#F5F5F7" class="num">1 (1.2%)</tspan></text>
  <circle cx="484" cy="224" r="3.5" fill="#545458"/>
  <text x="494" y="228" font-size="11.5" font-weight="400" fill="#AEAEB2">Just looking <tspan font-weight="500" fill="#F5F5F7" class="num">85 (98.8%)</tspan></text>
</svg>
