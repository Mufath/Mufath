    <ellipse cx="102" cy="98" rx="20" ry="11" fill="#6B4D2E"/><ellipse cx="100" cy="95" rx="18.4" ry="9.7" fill="#8F673D"/><ellipse cx="98.8" cy="91.9" rx="12.4" ry="5.3" fill="#B08452"/>
    <ellipse cx="132" cy="77" rx="24" ry="13" fill="#6B4D2E"/><ellipse cx="130" cy="74" rx="22.1" ry="11.4" fill="#8F673D"/><ellipse cx="128.2" cy="70.4" rx="14.9" ry="6.2" fill="#B08452"/></g>

