<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" fill="none" role="img" aria-labelledby="bonsai-title bonsai-desc">
  <title id="bonsai-title">Community Bonsai Lv.1 Sprout</title>
  <desc id="bonsai-desc">Moisture 100%, Status THRIVING, Views 66, Watered 1, Just Looking 65.</desc>
  <defs>
    <linearGradient id="apple-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D233E"/>
      <stop offset="48%" stop-color="#1D2B44"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <radialGradient id="bloom-rose" cx="16%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#9D6B84" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9D6B84" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom-sky" cx="78%" cy="82%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.42)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.42)"/>
    </linearGradient>
    <linearGradient id="card1-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242D40" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#1B2233" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="card2-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27324A" stop-opacity="0.66"/>
      <stop offset="100%" stop-color="#1B2438" stop-opacity="0.66"/>
    </linearGradient>
    <clipPath id="shell-clip">
      <rect x="6" y="6" width="788" height="248" rx="34"/>
    </clipPath>
    <filter id="soft-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="monoNoise"/>
      <feComponentTransfer in="monoNoise" result="alphaNoise">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    .num {
      font-variant-numeric: tabular-nums;
    }
    .bar-anim {
      transform-box: fill-box;
      transform-origin: left center;
      animation: growX 0.85s cubic-bezier(.22,1,.36,1) both;
    }
    .pulse-dot { animation: pulseDot 2.4s ease-in-out infinite; }
    @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Outer subtle Apple bezel halo -->
  <rect x="2" y="2" width="796" height="256" rx="37" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Main Atmospheric Frosted Widget Shell -->
  <g clip-path="url(#shell-clip)">
    <rect x="6" y="6" width="788" height="248" rx="34" fill="url(#apple-mesh)"/>
    <rect x="6" y="6" width="788" height="248" rx="34" fill="url(#bloom-rose)"/>
    <rect x="6" y="6" width="788" height="248" rx="34" fill="url(#bloom-sky)"/>
    <rect x="6" y="6" width="788" height="248" filter="url(#soft-grain)"/>
  </g>
  <rect x="6" y="6" width="788" height="248" rx="34" stroke="url(#glass-rim)" stroke-width="2.2"/>

  <!-- Left Hero Zone -->
  <circle cx="40" cy="36" r="4" fill="#34D399" class="pulse-dot"/>
  <text x="52" y="40" font-size="11.5" font-weight="700" fill="rgba(255,255,255,0.72)" letter-spacing="0.08em">STAGE 1/5 • SPROUT</text>

  <!-- Bonsai Pixel Art -->
  <g shape-rendering="crispEdges">
    <rect x="158" y="107" width="10" height="5" fill="#4ADE80"/>
    <rect x="148" y="112" width="10" height="5" fill="#4ADE80"/>
    <rect x="158" y="112" width="10" height="5" fill="#22C55E"/>
    <rect x="168" y="112" width="5" height="5" fill="#4ADE80"/>
    <rect x="143" y="117" width="5" height="5" fill="#4ADE80"/>
    <rect x="148" y="117" width="10" height="5" fill="#22C55E"/>
    <rect x="158" y="117" width="5" height="5" fill="#15803D"/>
    <rect x="168" y="117" width="5" height="5" fill="#22C55E"/>
    <rect x="173" y="117" width="5" height="5" fill="#4ADE80"/>
    <rect x="153" y="122" width="5" height="5" fill="#15803D"/>
    <rect x="163" y="122" width="5" height="5" fill="#A9744F"/>
    <rect x="173" y="122" width="10" height="5" fill="#22C55E"/>
    <rect x="158" y="127" width="5" height="5" fill="#A9744F"/>
    <rect x="163" y="127" width="5" height="5" fill="#855637"/>
    <rect x="158" y="132" width="5" height="5" fill="#855637"/>
    <rect x="163" y="132" width="5" height="5" fill="#593722"/>
    <rect x="153" y="137" width="5" height="5" fill="#A9744F"/>
    <rect x="158" y="137" width="5" height="5" fill="#855637"/>
    <rect x="163" y="137" width="5" height="5" fill="#593722"/>
    <rect x="138" y="142" width="50" height="5" fill="#4A3222"/>
    <rect x="133" y="147" width="60" height="5" fill="#F8FAFC"/>
    <rect x="133" y="152" width="55" height="5" fill="#CBD5E1"/>
    <rect x="188" y="152" width="5" height="5" fill="#94A3B8"/>
    <rect x="138" y="157" width="40" height="5" fill="#CBD5E1"/>
    <rect x="178" y="157" width="10" height="5" fill="#94A3B8"/>
    <rect x="138" y="162" width="40" height="5" fill="#CBD5E1"/>
    <rect x="178" y="162" width="10" height="5" fill="#94A3B8"/>
    <rect x="143" y="167" width="10" height="5" fill="#CBD5E1"/>
    <rect x="173" y="167" width="10" height="5" fill="#94A3B8"/>
  </g>

  <!-- Apple StandBy-style Status & Large Readout -->
  <path d="M42 181.5s-4.5 4.8-4.5 7.5a4.5 4.5 0 0 0 9 0c0-2.7-4.5-7.5-4.5-7.5Z" fill="#34D399"/>
  <text x="53" y="193" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.06em">THRIVING</text>
  <text x="36" y="233" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-0.03em" class="num">100%<tspan dx="6" font-size="14" font-weight="600" letter-spacing="0.06em" fill="rgba(255,255,255,0.72)">MOISTURE</tspan></text>

  <!-- Right Stacked Apple Cards -->
  <text x="322" y="39" font-size="12" font-weight="700" fill="rgba(255,255,255,0.72)" letter-spacing="0.08em">COMMUNITY BONSAI</text>

  <!-- Card 1: Growth & Latest Watering -->
  <rect x="316" y="50" width="450" height="82" rx="20" fill="url(#card1-fill)" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <rect x="334" y="62" width="20" height="20" rx="6" stroke="#F5F5F7" stroke-width="1.7" fill="none"/>
  <path d="M339.5 72.3l3.1 3.1 6-6.2" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="364" y="77" font-size="15" font-weight="600" fill="#F5F5F7">Growth • Lv.1 Sprout</text>
  <text x="748" y="77" text-anchor="end" font-size="13.5" font-weight="600" fill="#38BDF8" class="num">10 / 30 XP</text>
  <rect x="334" y="92" width="414" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
  <rect x="334" y="92" width="138.0" height="6" rx="3" fill="#38BDF8" class="bar-anim"/>
  <text x="334" y="118" font-size="12" fill="#A1A1AA">Last watered by @Mufath (6m ago)</text>

  <!-- Card 2: Frosted Glass Visitor Insights (Profile Views Replacement) -->
  <rect x="316" y="144" width="450" height="74" rx="20" fill="url(#card2-fill)" stroke="rgba(255,255,255,0.26)" stroke-width="1.2"/>
  <line x1="466" y1="158" x2="466" y2="204" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <line x1="616" y1="158" x2="616" y2="204" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <text x="391" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#CBD5E1" letter-spacing="0.06em">PROFILE VIEWS</text>
  <text x="391" y="199" text-anchor="middle" font-size="22" font-weight="700" fill="#F5F5F7" class="num">66</text>

  <text x="541" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#CBD5E1" letter-spacing="0.06em">WATERED</text>
  <text x="541" y="199" text-anchor="middle" font-size="22" font-weight="700" fill="#38BDF8" class="num">1</text>

  <text x="691" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#CBD5E1" letter-spacing="0.06em">JUST LOOKING</text>
  <text x="691" y="199" text-anchor="middle" font-size="22" font-weight="700" fill="#F5F5F7" class="num">65</text>

  <!-- Bottom Apple Pager Indicator -->
  <rect x="490" y="232" width="102" height="5" rx="2.5" fill="rgba(255,255,255,0.28)"/>
  <rect x="528" y="232" width="38" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>
